name: Next 16 migration helper

on:
  push:
    branches:
      - upgrade/next-16
    paths:
      - .github/workflows/next16-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/next-16

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Next 16 source migrations
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected pattern not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          # Supabase server client became async because cookies() is async in Next 16.
          replace(
              "lib/supabase/service.ts",
              "const supabase = getSupabaseServerClient();",
              "const supabase = await getSupabaseServerClient();",
          )
          for path in ["app/api/upload/resume/route.ts", "app/api/upload/jd/route.ts"]:
              replace(path, "const supabase = getSupabaseServerClient();", "const supabase = await getSupabaseServerClient();")

          # Route Handler params are promises in Next 16.
          route_paths = [
              "app/api/interviews/[id]/route.ts",
              "app/api/interviews/[id]/answer/route.ts",
              "app/api/interviews/[id]/question/route.ts",
              "app/api/interviews/[id]/report/route.ts",
          ]
          for path in route_paths:
              p = Path(path)
              text = p.read_text()
              text = text.replace(
                  "{ params }: { params: { id: string } }",
                  "{ params }: { params: Promise<{ id: string }> }",
              )
              text = text.replace("const interviewId = params.id;", "const { id: interviewId } = await params;")
              p.write_text(text)

          # Client dynamic pages should use useParams instead of synchronous page props.
          replace(
              "app/interview/[id]/page.tsx",
              'import { useRouter } from "next/navigation";',
              'import { useParams, useRouter } from "next/navigation";',
          )
          replace(
              "app/interview/[id]/page.tsx",
              "export default function InterviewRoomPage({ params }: { params: { id: string } }) {\n  const interviewId = params.id;",
              "export default function InterviewRoomPage() {\n  const params = useParams<{ id: string }>();\n  const interviewId = params.id;",
          )
          report = Path("app/interview/[id]/report/page.tsx")
          report_text = report.read_text()
          report_text = report_text.replace(
              'import { useEffect, useState } from "react";',
              'import { useEffect, useState } from "react";\nimport { useParams } from "next/navigation";',
          )
          report_text = report_text.replace(
              "export default function InterviewReportPage({ params }: { params: { id: string } }) {\n  const interviewId = params.id;",
              "export default function InterviewReportPage() {\n  const params = useParams<{ id: string }>();\n  const interviewId = params.id;",
          )
          report.write_text(report_text)

          # Next 16 renamed middleware.ts to proxy.ts and middleware() to proxy().
          middleware = Path("middleware.ts")
          proxy = Path("proxy.ts")
          proxy.write_text(middleware.read_text().replace("function middleware(", "function proxy("))
          middleware.unlink()

          # Pin the security-patched Active LTS framework and React 19.2.
          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package["dependencies"]["next"] = "16.3.3"
          package["dependencies"]["react"] = "19.2.0"
          package["dependencies"]["react-dom"] = "19.2.0"
          package["devDependencies"]["@types/react"] = "^19.0.0"
          package["devDependencies"]["@types/react-dom"] = "^19.0.0"
          package["scripts"].pop("lint", None)
          package_path.write_text(json.dumps(package, indent=2) + "\n")
          PY

      - name: Regenerate dependency lockfile
        run: npm install --package-lock-only

      - name: Verify migrated source
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json lib/supabase/service.ts app/api/upload/resume/route.ts app/api/upload/jd/route.ts 'app/api/interviews/[id]/route.ts' 'app/api/interviews/[id]/answer/route.ts' 'app/api/interviews/[id]/question/route.ts' 'app/api/interviews/[id]/report/route.ts' 'app/interview/[id]/page.tsx' 'app/interview/[id]/report/page.tsx' proxy.ts middleware.ts
          git commit -m "upgrade: migrate CAIRA to Next.js 16.3.3 and React 19.2"
          git push origin HEAD:upgrade/next-16
