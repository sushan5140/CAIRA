name: Google GenAI SDK migration

on:
  push:
    branches:
      - hardening/genai-sdk
    paths:
      - .github/workflows/genai-sdk-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: hardening/genai-sdk

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Migrate source
        run: python .github/scripts/migrate-genai.py

      - name: Replace legacy SDK dependency
        run: |
          npm uninstall @google/generative-ai
          npm install --save-exact @google/genai@2.22.0

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/migrate-genai.py .github/workflows/genai-sdk-migration.yml
          git add package.json package-lock.json lib/ai/gemini.ts lib/ai/prompts.ts .env.example
          git commit -m "refactor(ai): migrate to Google GenAI SDK with request timeouts"
          git push origin HEAD:hardening/genai-sdk
