name: Live model copy fix

on:
  push:
    branches:
      - fix/live-model-copy
    paths:
      - .github/workflows/live-copy-fix.yml

permissions:
  contents: write

jobs:
  fix-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/live-model-copy

      - name: Correct stale live model copy
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "app/page.tsx": {
                  "Gemini 1.5 Adaptive Loop Active": "Adaptive Evaluator • Gemini 3.8 Default",
              },
              "components/footer.tsx": {
                  "All AI Evaluation Systems Operational": "Adaptive evaluation + offline fallback ready",
                  "Google Gemini 1.5 Calibration": "Gemini 3.8 Default • Configurable",
                  "Gemini 1.5 Flash": "Gemini 3.8 Default",
              },
          }

          for file_name, mapping in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f"Expected text missing from {file_name}: {old}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/footer.tsx
          git commit -m "fix(ui): align live Gemini and fallback status copy"
          git push origin HEAD:fix/live-model-copy
